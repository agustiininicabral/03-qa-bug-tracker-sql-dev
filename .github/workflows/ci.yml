name: Bug Tracker Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI import
        run: |
          export BUGTRACKER_DB="$RUNNER_TEMP/bugtracker.db"
          python app/bugtracker.py init
          python app/bugtracker.py import --csv data/bugs.csv
          python app/bugtracker.py list-open --limit 10
